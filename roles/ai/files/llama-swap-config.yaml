models:
  # Daily Driver (Llama 3.2 3B)
  llama-3b:
    ttl: 120
    cmd: |
      llama-server --port ${PORT} \
        -hf bartowski/Llama-3.2-3B-Instruct-GGUF:Q4_K_M \
        -c 4096 \
        -ngl 99

#
# Coding
#

  # Heavy Coder (Qwen 2.5 Coder 7B) - Tuned with max safe partial offload
  qwen-2.5-coder-7b:
    ttl: 60
    cmd: |
      llama-server --port ${PORT} \
        -hf unsloth/Qwen2.5-Coder-7B-Instruct-GGUF:q4_k_m \
        -c 2048 \
        -ngl 18 \
        --chat-template chatml

  # Middleweight Coder (Qwen 2.5 Coder 3B) - 100% VRAM Full Speed
  qwen-2.5-coder-3b:
    ttl: 60
    cmd: |
      llama-server --port ${PORT} \
        -hf unsloth/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M \
        -c 32768 \
        -ngl 99 \
        --chat-template chatml

  # Lightweight Coder (Qwen 2.5 Coder 1.5B) - 100% VRAM Full Speed
  qwen-2.5-coder-1.5b:
    ttl: 60
    cmd: |
      llama-server --port ${PORT} \
        -hf unsloth/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M \
        -c 65536 \
        -ngl 99\ 
        --chat-template chatml

#
# Decision
#

  # System One Router (Julia-1)
  julia-1:
    ttl: 300
    cmd: |
      llama-server --port ${PORT} \
        -hf ggml-org/Julia-1-GGUF:q8_0 \
        -c 2048 -b 2048 -ub 2048 \
        -ngl 99

  pplx-decider-flash-v1.2:
      ttl: 300
      cmd: |
        llama-server --port ${PORT} \
          -hf Jakevin/pplx-decider-flash-v1.2-text-GGUF:Q4_K_M \
          --hf-file pplx-decider-flash-v1.2-Q4_K_M.gguf         \
          -c 3072 \
          -ngl 99 \
          -fa on \
          -b 2048 \
          -ub 2048 \
          -t 6 \
          -tb 12

