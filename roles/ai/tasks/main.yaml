---

# Install Ollama as a systemd service per the instructions at:
#    https://github.com/ollama/ollama/blob/main/docs/linux.md

- name: "create ollama group"
  group:
    name: ollama
    state: present
  tags:
    - "ollama"
    - "ai"

- name: "create ollama user"
  user:
    name: ollama
    group: ollama
    state: present
  tags:
    - "ollama"
    - "ai"

- name: "get latest ollama version number"
  uri:
    url: https://api.github.com/repos/ollama/ollama/releases/latest
    headers:
      Accept: application/vnd.github+json
      Authorization: Bearer {{ lookup('env','GITHUB_TOKEN') }}
  register: ollama_latest_version_result
  tags:
    - "ollama"
    - "ai"

- name: "get installed ollama version number"
  command: ollama --version
  register: ollama_installed_version_result
  changed_when: false
  failed_when: false
  tags:
    - "ollama"
    - "ai"

- name: "trim installed ollama version number"
  set_fact:
    ollama_installed_version_result: "{{ ('command not found' in ollama_installed_version_result.msg | default('')) | ternary('', 'v' + (ollama_installed_version_result.stdout | trim | split(' ') | last)) }}"
  changed_when: false
  tags:
    - "ollama"
    - "ai"


- name: "remove previous installation's library files"
  file: 
    path: "/usr/local/lib/ollama"
    state: absent
  when: ollama_latest_version_result.json.tag_name  !=  ollama_installed_version_result
  tags:
    - "ollama"
    - "ai"

- name: "download and unarchive new Ollama installation"
  unarchive:
    src: "{{ ollama_archive_url }}"
    remote_src: yes
    dest: "/usr/local"
    owner: "ollama"
    group: "ollama"
  when: ollama_latest_version_result.json.tag_name  !=  ollama_installed_version_result
  tags:
    - "ollama"
    - "ai"

- name: "copy the ollama daemon service description"
  copy:
    src: ../files/ollama.service
    dest: /etc/systemd/system
    mode: a+x
  register: ollama_service_daemon_result
  tags:
    - "ollama"
    - "ai"
  
- name: "start the ollama service if the service description was installed"
  systemd:
    name: ollama
    enabled: yes
    state: started
    daemon_reload: yes
  tags:
    - "ollama"
    - "ai"

- name: "restart the ollama service if a new version was installed"
  systemd:
    name: ollama
    state: restarted
  when: ollama_latest_version_result.json.tag_name  !=  ollama_installed_version_result
  tags:
    - "ollama"
    - "ai"

# Should the Alpaca-managed Ollama be removed in favor of the full install
# above?
- name: "install Alpaca (and managed Ollama) via flathub"
  flatpak:
    name: "{{ item }}"
  with_items:
    - "com.jeffser.Alpaca"
    - "com.jeffser.Alpaca.Plugins.Ollama"
  tags:
    - "alpaca"
    - "ai"

# Install the Crush AI assistant via the Debian package manager per the
# instructions found at: https://deepwiki.com/charmbracelet/crush/2.1-installation-and-setup#debianubuntu

- name: "add the crush apt repository"
  ansible.builtin.deb822_repository:
    name: charm
    types: deb
    uris: https://repo.charm.sh/apt/
    suites: "*"
    components: "*"
    architectures: amd64
    signed_by: "{{ crush_apt_key_url }}"
  tags:
  - "crush"
  - "ai"

- name: add crush
  ansible.builtin.apt:
    pkg: crush
    state: present
  tags:
  - "crush"
  - "ai"

# Cline CLI AI coding assistant
# Instructions found at: https://docs.cline.bot/cline-cli/installation

- name: add cline CLI
  npm:
    name: cline
    global: true
    state: present
  tags:
  - "cline"
  - "ai"
