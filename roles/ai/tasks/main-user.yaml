---

# Cline CLI AI coding assistant
# Instructions found at: https://docs.cline.bot/cline-cli/installation

- name: Add cline CLI
  community.general.npm:
    name: cline
    global: true
    state: present
  tags:
    - "cline"
    - "ai"

# Install llama.cpp and llama-swap
# https://gemini.google.com/app/067d20586c569a63

# ==========================================
# 1. llama.cpp Installation & Setup
# ==========================================

- name: Ensure target build, binary, and systemd user directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ llama_cpp_source_directory }}"
    - "{{ llama_cpp_bin_directory }}"
    - "{{ systemd_user_dir }}"
  tags:
    - llama.cpp
    - ai

- name: Check if llama-server binary already exists in local path
  ansible.builtin.stat:
    path: "{{ llama_cpp_bin_directory }}/llama-server"
  register: binary_stat
  tags:
    - llama.cpp
    - ai

- name: Check for NVIDIA GPU hardware via lspci
  ansible.builtin.command: lspci
  register: lspci_check
  changed_when: false
  failed_when: false
  tags:
    - llama.cpp
    - ai

- name: Determine if an NVIDIA GPU is present
  ansible.builtin.set_fact:
    has_nvidia_gpu: "{{ lspci_check.rc == 0 and 'NVIDIA' in lspci_check.stdout }}"
  tags:
    - llama.cpp
    - ai

- name: Ensure non-free and non-free-firmware components are enabled in Debian sources
  become: true
  ansible.builtin.apt_repository:
    repo: "deb http://deb.debian.org/debian {{ ansible_distribution_release }} main contrib non-free non-free-firmware"
    state: present
    filename: debian-sources
  when: has_nvidia_gpu
  tags:
    - llama.cpp
    - ai

- name: Install NVIDIA CUDA toolkit via apt when GPU is detected
  become: true
  ansible.builtin.apt:
    name: nvidia-cuda-toolkit
    state: present
    update_cache: true
  when: has_nvidia_gpu
  tags:
    - llama.cpp
    - ai

- name: Clone or update the llama.cpp git repository
  ansible.builtin.git:
    repo: 'https://github.com/ggml-org/llama.cpp.git'
    dest: "{{ llama_cpp_source_directory }}"
    version: master
    update: true
  register: git_repo
  tags:
    - llama.cpp
    - ai

- name: Build and install llama.cpp pipeline
  block:
    - name: Configure CMake build tree with appropriate hardware flags
      ansible.builtin.command:
        cmd: "cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF {{ '-DGGML_CUDA=ON' if has_nvidia_gpu else '-DGGML_CUDA=OFF' }}"
        chdir: "{{ llama_cpp_source_directory }}"
      changed_when: true

    - name: Compile llama.cpp binaries with parallel job scaling
      ansible.builtin.command:
        cmd: "cmake --build build --config Release -j {{ ansible_processor_vcpus | default(4) }}"
        chdir: "{{ llama_cpp_source_directory }}"
      changed_when: true

    - name: Install compiled binaries into user local path (~/.local/bin)
      ansible.builtin.command:
        cmd: "cmake --install build --prefix {{ ansible_env.HOME }}/.local"
        chdir: "{{ llama_cpp_source_directory }}"
      changed_when: true
  when: git_repo.changed or not binary_stat.stat.exists
  tags:
    - llama.cpp
    - ai

# ==========================================
# 2. llama-swap Installation & Setup
# ==========================================

# - name: Ensure Go and Node.js toolchains are installed for building llama-swap and UI
#   become: true
#   ansible.builtin.apt:
#     name:
#       - golang-go
#       - nodejs
#       - npm
#     state: present
#     update_cache: true
#   tags:
#     - llama-swap
#     - ai

- name: Clone or update the llama-swap git repository
  ansible.builtin.git:
    repo: 'https://github.com/mostlygeek/llama-swap.git'
    dest: "{{ llama_swap_source_directory }}"
    version: main
    update: true
  register: llama_swap_git
  tags:
    - llama-swap
    - ai

- name: Check if llama-swap binary already exists in local path
  ansible.builtin.stat:
    path: "{{ llama_swap_bin_directory }}/llama-swap"
  register: swap_binary_stat
  tags:
    - llama-swap
    - ai

- name: Build llama-swap UI frontend assets
  ansible.builtin.command:
    cmd: "{{ item }}"
    chdir: "{{ llama_swap_source_directory }}/ui"
  loop:
    - "npm install"
    - "npm run build"
  when: llama_swap_git.changed or not swap_binary_stat.stat.exists
  changed_when: true
  tags:
    - llama-swap
    - ai

- name: Build and install llama-swap binary with embedded UI
  ansible.builtin.command:
    cmd: "go build -tags embed_ui -o {{ llama_swap_bin_directory }}/llama-swap"
    chdir: "{{ llama_swap_source_directory }}"
  when: llama_swap_git.changed or not swap_binary_stat.stat.exists
  changed_when: true
  tags:
    - llama-swap
    - ai

- name: Ensure llama-swap configuration directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/llama-swap"
    state: directory
    mode: '0755'
  tags:
    - llama-swap
    - ai

- name: Copy llama-swap config.yaml from role files
  ansible.builtin.copy:
    src: llama-swap-config.yaml
    dest: "{{ ansible_env.HOME }}/.config/llama-swap/config.yaml"
    mode: '0644'
  register: swap_config_update
  tags:
    - llama-swap
    - ai

- name: Copy llama-swap systemd user service file
  ansible.builtin.copy:
    src: llama-swap.service
    dest: "{{ systemd_user_dir }}/llama-swap.service"
    mode: '0644'
  register: swap_service_update
  tags:
    - llama-swap
    - ai

# ==========================================
# 3. Systemd User Service Management
# ==========================================

- name: Enable user lingering for background headless persistence
  become: true
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ ansible_env.USER }}"
  register: linger_check
  changed_when: "'enabling' in linger_check.stdout or not ansible_check_mode"
  failed_when: false
  tags:
    - llama-swap
    - ai

- name: Daemon-reload systemd user manager
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  when: swap_service_update.changed | default(false)
  tags:
    - llama-swap
    - ai

- name: Enable and start llama-swap user service
  ansible.builtin.systemd_service:
    name: llama-swap.service
    enabled: true
    state: started
    scope: user
  tags:
    - llama-swap
    - ai
