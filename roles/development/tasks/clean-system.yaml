---

# dbeaver

- name: "Remove dbeaver apt"
  ansible.builtin.apt:
    pkg:
      - "dbeaver-ce"
    state: "absent"
  tags:
      - "dbeaver"
      - "database"
      - "development"

- name: "Remove the dbeaver apt repository file"
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/dbeaver.sources"
    state: "absent"
  tags:
    - "dbeaver"
    - "database"
    - "development"

- name: "Remove legacy dbeaver apt repository entries"
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/dbeaver-ce.list"
    state: "absent"
  tags:
    - "dbeaver"
    - "database"
    - "development"

# Codium

- name: "Remove vscodium"
  ansible.builtin.apt:
    pkg:
      - "codium"
    state: "absent"
  tags:
    - "vscodium"
    - "ide"
    - "development"

- name: "Remove the vscodium apt repository file"
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/vscodium.sources"
    state: "absent"
  tags:
    - "vscodium"
    - "ide"
    - "development"

- name: "Remove legacy vscodium apt repository entries"
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/vscodium.list"
    state: "absent"
  tags:
    - "vscodium"
    - "ide"
    - "development"

- name: "remove Codium installed via via flatpak"
  community.general.flatpak:
    name: "com.vscodium.codium"
    state: "absent"
  tags:
    - "codium"
    - "insomnia"
    - "rest"
    - "development"



# Cleanup for fasttrack repositories migrated to deb822_repository
- name: "Remove legacy fasttrack-fasttrack repository file"
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/fasttrack-fasttrack.list"
    state: "absent"
  tags:
    - "virtualbox"
    - "virtualization"

- name: "Remove legacy fasttrack-backports-staging repository file"
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/fasttrack-backports-staging.list"
    state: "absent"
  tags:
    - "virtualbox"
    - "virtualization"
