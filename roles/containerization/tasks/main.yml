---
# File: roles/containerization/tasks/main.yml

#
# Podman
#

- name: "Install podman and tools for container execution environment"
  ansible.builtin.apt:
    pkg:
      - "podman"
      - "podman-compose"
      - "podman-docker"
      - "podman-toolbox"
  tags:
    - "containerization"
    - "podman"
