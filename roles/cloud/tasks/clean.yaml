---
# Cleanup for Azure CLI repository migrated to deb822_repository
- name: "Remove legacy Azure CLI repository file"
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/azure-cli.list"
    state: "absent"
  tags:
    - cloud
    - azure

- name: "Remove legacy Azure CLI signing key from trusted.gpg.d"
  ansible.builtin.file:
    path: "/etc/apt/trusted.gpg.d/microsoft.asc"
    state: "absent"
  tags:
    - cloud
    - azure
