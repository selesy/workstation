---
# File: roles/cloud/tasks/main.yml

- name: uninstall AWS CLI v1 via PIP
  pip:
    name:
    - awscli
    - awscliv2
    state: absent
  tags:
  - cloud
  - aws

- name: "remove aws symlink"
  file:
    dest: "/usr/local/bin/aws"
    state: "absent"
  tags:
  - cloud
  - aws

- name: "remove aws_completer symlink"
  file:
    dest: "/usr/local/bin/aws_completer"
    state: "absent"
  tags:
  - cloud
  - aws

- name: "remove aws cli"
  file:
    dest: "/usr/local/aws-cli"
    state: "absent"
  tags:
  - cloud
  - aws

- name: "add the Azure CLI signing key"
  get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /usr/share/keyrings/microsoft-archive-keyring.gpg
  tags:
  - cloud
  - azure

- name: "add the Azure CLI repository"
  ansible.builtin.deb822_repository:
    name: azure-cli
    types: deb
    uris: https://packages.microsoft.com/repos/azure-cli/
    suites: "{{ ansible_distribution_release if ansible_distribution_release in ['bookworm', 'trixie'] else 'bookworm' }}"
    components: main
    architectures: amd64
    signed_by: /usr/share/keyrings/microsoft-archive-keyring.gpg
    state: present
  tags:
  - cloud
  - azure

- name: "install the Azure CLI"
  apt:
    pkg:
    - azure-cli
  tags:
  - cloud
  - azure
