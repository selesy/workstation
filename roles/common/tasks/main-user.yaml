---

- name: "Create a folder for AppImage applications"
  ansible.builtin.file:
    path: "{{ user_appimage_directory }}"
    state: directory
  tags:
    - "appimage"

- name: "get latest Obsidian release version"
  community.general.github_release:
    user: obsidianmd
    repo: obsidian-releases
    action: latest_release
  register: obsidian_release_result
  tags:
    - "obsidian"
    - "productivity"
    - "office"
    - "appimage"

- name: "Overwrite Obsidian version placeholder"
  ansible.builtin.set_fact:
    obsidian_version: "{{ obsidian_release_result.tag | regex_replace('^v', '') }}"
  tags:
    - "obsidian"
    - "productivity"
    - "office"
    - "appimage"

- name: "install Obsidian as AppImage"
  ansible.builtin.get_url:
    url: "{{ obsidian_appimage_url }}"
    dest: "{{ user_appimage_directory }}"
    mode: "0755"
  tags:
    - "obsidian"
    - "productivity"
    - "office"
    - "appimage"
