# File: roles/common/tasks/main.yml

- name: add kernel headers
  apt:
    pkg:
      - "linux-headers-amd64"
    state: "latest"
  tags:
    - "common"

- name: "install (extra) DKMS modules"
  apt:
    pkg:
      - "v4l2loopback-dkms"
    state: "latest"
  tags:
    - "common"

- name: install basic Linux tools
  apt:
    pkg:
    - "asciidoc" # Office
    - "dex"
    - "fonts-opendyslexic"
    - "screen"
    - "secure-delete"
    - "stacer"
    - "tree"
    - "wipe"
    - "bash-completion"
    - "byobu"
    - "expect"
    - "gdebi"
    state: "latest"
  tags:
  - "common"

- name: "Install common system tools"
  ansible.builtin.apt:
    pkg:
      - "gparted"
      - "minicom"
      - "ncdu"
  tags:
    - "system"
    - "common"

- name: Install common system tools in Debian 12
  when: ansible_distribution_major_version == "12"
  apt:
    pkg:
      - deborphan
    state: "latest"
  tags:
    - system
    - common

- name: Install common system tools in Debian 13
  when: ansible_distribution_major_version == "13"
  apt:
    deb: http://http.us.debian.org/debian/pool/main/d/deborphan/deborphan_1.7.35_amd64.deb
  tags:
    - system
    - common

# Some of these security tools are recommended due to their inclusion in
# drduh's Yubikey Guide which is available at https://github.com/drduh/Yubikey-Guide
- name: "install security tools"
  apt:
    pkg:
    - "cryptsetup"
    - "dirmngr"
    - "gnupg2" # Security
    - "gnupg-agent"
    # - "hopenpgp-tools" # Security
    - "oathtool"
    - "paperkey"
    - "parcimonie"
    - "pass"
    - "pass-extension-otp"
    - "pcscd"
    - "qtpass"
    - "scdaemon"
    - "seahorse"
    - "ssh-askpass-gnome"
    - "wget"
    - "yubikey-personalization"
    - "yubikey-manager"
  tags:
  - "security"
  - "common"

- name: "Install grephics tools"
  ansible.builtin.apt:
    pkg:
      - "gpick"
      - "gimp"
      - "inkscape"
      - "kruler"
      - "screenruler"
      - "xsane"
  tags:
    - "graphics"
    - "common"

