---
# File: roles/common/tasks/main.yml

- name: install basic Linux tools
  apt:
    pkg:
    - "asciidoc" # Office
    - "deborphan" # System
    - "fonts-opendyslexic"
    - "gparted" # System
    - "minicom" # System
    - "screen"
    - "secure-delete"
    - "stacer"
    - "tree"
    - "wipe"
    - "bash-completion"
    - "byobu"
    - "expect"
    - "gdebi"
    state: "latest"
  tags:
  - "common"

- name: "install security tools"
  apt:
    pkg:
    - "gnupg2" # Security
    # - "hopenpgp-tools" # Security
    - "oathtool"
    - "parcimonie"
    - "pass"
    - "pass-extension-otp"
    - "qtpass"
    - "ssh-askpass-gnome"
    - "seahorse"
  tags:
  - "security"
  - "common"

- name: "Install grephics tools"
  ansible.builtin.apt:
    pkg:
      - "gpick"
      - "gimp"
      - "inkscape"
      - "kruler"
      - "screenruler"
      - "xsane"
  tags:
    - "graphics"
    - "common"

# Add support for Dell hardware - see: https://askubuntu.com/questions/1341912/goodix-fingerprint-driver-linux

- name: add the Dell signing key
  apt_key:
    keyserver: keyserver.ubuntu.com
    id: F9FDA6BED73CDC22
    state: present
  when: ansible_system_vendor == "Dell Inc."
  tags:
  - dell

