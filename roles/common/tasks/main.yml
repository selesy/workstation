---
# File: roles/common/tasks/main.yml

- name: install basic Linux tools
  apt:
    pkg:
    - "asciinema"
    - "asciidoc"
    - "audacity"
    - chromium
    - "curl"
    - "deborphan"
    - "fonts-opendyslexic"
    - "gnupg2"
    - "gparted"
    # - "hopenpgp-tools"
    - "lynx"
    - "minicom"
    - "oathtool"
    - "parcimonie"
    - "pass"
    - "pass-extension-otp"
    - "qtpass"
    - "ssh-askpass-gnome"
    - "recordmydesktop"
    - "screen"
    - "seahorse"
    - "secure-delete"
    - "sshfs"
    - "sshuttle"
    - "stacer"
    - "tftp"
    - "traceroute"
    - "tree"
    - "vlc"
    - "whois"
    - "wipe"
    state: "latest"

- name: install basic Linux tools (Debian)
  apt:
    pkg:
    - "bash-completion"
    - "byobu"
    - "expect"
    - "gdebi"
    - "libuvc0"
    state: "latest"
  when: ansible_distribution == "Debian"

# Add support for Dell hardware - see: https://askubuntu.com/questions/1341912/goodix-fingerprint-driver-linux

- name: add the Dell signing key
  apt_key:
    keyserver: keyserver.ubuntu.com
    id: F9FDA6BED73CDC22
    state: present
  when: ansible_system_vendor == "Dell Inc."
  tags:
  - dell

