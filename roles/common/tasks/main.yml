- name: install tools and libraries for bluetooth devices
  apt:
    pkg:
    - "btscanner"
    - "bluez-tools"
    - "blueman"
  tags:
  - "bluetooth"

# - name: copy the freemind icon
#   file:
#     path: /snap/bin/freemind.png
#     state: absent
#   tags:
#   - freemind
#   - clean-legacy

- name: add the freemind desktop item to the menu
  file:
    path: /usr/share/applications/freemind.desktop
    state: absent
  tags:
  - freemind
  - clean-legacy
    
- name: install the NTP daemon (on Mint ... it's not installed by default)
  apt:
    name: ntp
    state: latest
  


# Install redshift (replaces flux)

- name: add redshift
  apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
    - redshift
    - redshift-gtk
  tags:
  - ergonomics

# Install power management utilities

- name: "install TLP and TLP-rdw"
  apt:
    name: "{{ packages }}"
    state: "present"
  vars:
    packages:
    - "tlp"
    - "tlp-rdw"
  register: "tlp_installed"
  tags:
  - "power-management"

- name: "start up TLP"
  command: "tlp start"
  when: "tlp_installed is changed"
  tags:
  - "power-management"
