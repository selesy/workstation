# Add support for biometrics - see: https://github.com/Am0rphous/Shenzhen-Goodix-Fingerprint-Reader-

- name: install tools and libraries for biometrics
  apt:
    pkg:
    - "libbiometric0"
    - "libc6"
    - "libfprint-2-2"
    - "libglib2.0-0"
    - "bio-drv-api-0.10"
    - "biometric-utils"
    - "libpam-fprintd"
  tags:
  - "biometrics"

