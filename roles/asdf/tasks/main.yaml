- name: get asdf version
  shell: asdf version
  register: asdf_version_result
  changed_when: false
  failed_when: "asdf_version_result.rc > 0"
  tags:
  - asdf

- set_fact:
    asdf_version: "{{ asdf_version_result.stdout | ansible.builtin.split('-') }}"
  changed_when: false
  tags:
  - asdf

- name: update installed asdf binary
  shell: asdf update
  register: asdf_update_result
  changed_when:
  - 'asdf_version[0] not in asdf_update_result.stderr'
  - 'asdf_version[1] not in asdf_update_result.stderr'
  failed_when: asdf_update_result.rc > 0
  tags:
  - asdf

# TODO: figure out how to make this pretty by adding a newline

- name: install tools via asdf
  include_tasks: tools.yml
  loop: "{{ tools }}"
  loop_control:
    loop_var: tool_item
  tags:
  - asdf

